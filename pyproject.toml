[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luck-audit"
version = "0.2.0"
description = "Post-hoc evidence-sufficiency audit for agent traces: reports the share of successful runs that were lucky, not competent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amna Raheeba" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit"]

[project.scripts]
luck-audit = "luck_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["luck_audit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
