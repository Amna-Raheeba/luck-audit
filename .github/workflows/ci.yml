name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q
      - run: python -m luck_audit demo
      - run: python notebooks/01_luck_rate_experiment.py
      - run: python notebooks/02_matching_sensitivity.py
      - run: python notebooks/03_risk_weighted_luck.py
      - run: python scripts/reproduce_results.py
